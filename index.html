<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>WhatsApp Status Video</title>
  <style>
    body {
      margin: 0;
      background: #000;
    }

    .status-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-bar-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      /* default background */
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: red;
      /* red when loading/playing */
      transition: width 0.1s linear;
    }
  </style>
</head>

<body>

  <div class="status-container">
    <video id="statusVideo" autoplay muted playsinline>
      <source src="./tournament.mov" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('statusVideo');
    const progressBar = document.getElementById('progressBar');

    video.addEventListener('timeupdate', () => {
      // console.log(video.currentTime, video.duration);

      const progress = (video.currentTime / video.duration) * 100;
      progressBar.style.width = `${progress}%`;
    });
  </script>
  <script src="./lee.js"></script>

</body>

</html>
